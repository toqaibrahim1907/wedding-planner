async function setupWedding(){let n=await new Promise(r=>form('أهلاً 💍',[{k:'n',l:'اسمك'},{k:'c',l:'كود الدعوة (لو خطيبك أنشأ المشروع) — سيبيه فاضي لإنشاء مشروع جديد'}],r));
const {data,error}=n.c?await sb.rpc('join_wedding',{c:n.c.trim(),n:n.n}):await sb.rpc('create_wedding',{n:n.n});
if(error)return alert('الكود غلط أو المشروع مكتمل');wid=localStorage.wid=data.id;code=localStorage.code=data.code;
if(!n.c){for(const [sec,sub,l] of SEED)for(const name of l)await put({id:uid(),kind:'item',data:{sec,sub,name,est:0,act:0},updated_at:new Date().toISOString(),deleted:false,dirty:1});
await put({id:uid(),kind:'cfg',data:{a:n.n,b:'خطيبي',have:0,save:0,bonus:0},updated_at:new Date().toISOString(),deleted:false,dirty:1});localStorage.me='a'}else localStorage.me=me='b';await sync()}
async function boot(){await load();
if(sb){const {data:{session}}=await sb.auth.getSession();
if(!session&&!wid){const e=prompt('الإيميل'),p=prompt('كلمة السر (٦ حروف على الأقل)');let r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)r=await sb.auth.signUp({email:e,password:p});if(r.error)return alert(r.error.message);return boot()}
if(session&&!wid){const {data:m}=await sb.from('members').select('wedding_id,weddings(code)').limit(1);if(m?.[0]){wid=localStorage.wid=m[0].wedding_id;code=localStorage.code=m[0].weddings.code}else await setupWedding();await load()}
sb.channel('r').on('postgres_changes',{event:'*',schema:'public',table:'records'},sync).subscribe();sync()}
else if(!K('item').length){for(const [sec,sub,l] of SEED)for(const name of l)await put({id:uid(),kind:'item',data:{sec,sub,name,est:0,act:0},updated_at:new Date().toISOString(),deleted:false,dirty:0});await put({id:uid(),kind:'cfg',data:{a:'العروسة',b:'العريس',have:0,save:0,bonus:0},updated_at:'',deleted:false,dirty:0});await load()}
render()}
boot();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
