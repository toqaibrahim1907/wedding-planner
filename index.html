<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>الفرح 💍</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg">
    <meta name="theme-color" content="#7c3d5e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://joxgqdogavgxojpsqpex.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">
    <style>
        /* instant loader */
        #splash {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #2d0f20, #5c1f3e, #7c3d5e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity .4s
        }

        #splash.out {
            opacity: 0;
            pointer-events: none
        }

        .spin {
            width: 48px;
            height: 48px;
            border: 4px solid #ffffff30;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 16px
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #splash p {
            color: #fff;
            font-family: system-ui;
            font-size: 14px;
            opacity: .7
        }

        :root {
            --rose: #9b3d64;
            --rose2: #c4607e;
            --gold: #c9a84c;
            --gold2: #e8c96d;
            --cream: #fdf8f3;
            --card: #fff;
            --line: #ecddd6;
            --soft: #faedf2;
            --ink: #2d1f28;
            --muted: #9a7d88;
            --ok: #3d8b5e;
            --bad: #c0392b;
            --nav-h: 72px;
            --radius: 18px;
            --shadow: 0 4px 24px #9b3d6420;
            --shadow2: 0 8px 32px #9b3d6430;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font: 500 15px/1.6 Tajawal, system-ui, sans-serif;
            padding-bottom: calc(var(--nav-h) + 12px);
            min-height: 100vh
        }

        main {
            max-width: 740px;
            margin: auto;
            padding: 16px
        }

        h2 {
            font-size: 16px;
            font-weight: 800;
            margin: 22px 0 10px;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 6px
        }

        /* ── CARDS ── */
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: transform .15s, box-shadow .15s
        }

        .card:active {
            transform: scale(.99)
        }

        .hero-card {
            background: linear-gradient(135deg, var(--rose) 0%, #6b2547 60%, #3d1530 100%);
            color: #fff;
            border: 0;
            text-align: center;
            padding: 32px 20px 28px;
            position: relative;
            overflow: hidden
        }

        .hero-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")
        }

        .hero-card .days-big {
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
            display: block;
            background: linear-gradient(180deg, #fff 0%, var(--gold2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        .hero-card .days-label {
            font-size: 18px;
            font-weight: 700;
            opacity: .9;
            margin-top: 4px
        }

        .hero-card .date-sm {
            font-size: 13px;
            opacity: .7;
            margin-top: 6px
        }

        /* ── STATS GRID ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: var(--shadow)
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 4px
        }

        .stat-val {
            font-size: 20px;
            font-weight: 900;
            color: var(--ink)
        }

        .stat-val.rose {
            color: var(--rose)
        }

        .stat-val.gold {
            color: var(--gold)
        }

        .stat-val.ok {
            color: var(--ok)
        }

        .stat-val.bad {
            color: var(--bad)
        }

        /* ── PROGRESS ── */
        .prog-wrap {
            margin: 6px 0 10px
        }

        .prog-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 5px
        }

        .bar {
            height: 10px;
            background: var(--soft);
            border-radius: 99px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--gold), var(--rose2));
            transition: width .6s cubic-bezier(.4, 0, .2, 1)
        }

        .bar.ok-bar i {
            background: linear-gradient(90deg, #3d8b5e, #5dbf8a)
        }

        /* ── BUTTONS ── */
        button,
        .btn {
            font: 700 14px/1 Tajawal, system-ui;
            border: 1.5px solid var(--rose);
            background: #fff;
            color: var(--rose);
            border-radius: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap
        }

        button:hover {
            background: var(--soft)
        }

        button.p {
            background: linear-gradient(135deg, var(--rose), var(--rose2));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px #9b3d6440
        }

        button.p:hover {
            opacity: .9
        }

        button.g {
            background: linear-gradient(135deg, var(--gold), var(--gold2));
            color: #fff;
            border-color: transparent
        }

        button.x {
            border-color: var(--bad);
            color: var(--bad)
        }

        button.x:hover {
            background: #fff5f5
        }

        .qa {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            margin-bottom: 4px
        }

        .qa::-webkit-scrollbar {
            display: none
        }

        /* ── ROWS ── */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .sm {
            font-size: 12.5px;
            color: var(--muted)
        }

        .tag {
            font-size: 11px;
            background: var(--soft);
            color: var(--rose);
            border-radius: 8px;
            padding: 2px 9px;
            font-weight: 700
        }

        .late {
            color: var(--bad);
            font-weight: 700
        }

        .ok-t {
            color: var(--ok);
            font-weight: 700
        }

        /* ── TASK ROW ── */
        .task-row {
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
            transition: box-shadow .15s
        }

        .task-row:hover {
            box-shadow: var(--shadow2)
        }

        .task-row b {
            font-size: 14px
        }

        .task-row.done-row b {
            text-decoration: line-through;
            color: var(--muted)
        }

        .task-status {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap
        }

        .status-todo {
            background: #fff3e0;
            color: #e67e22
        }

        .status-doing {
            background: #e3f2fd;
            color: #1976d2
        }

        .status-done {
            background: #e8f5e9;
            color: var(--ok)
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            bottom: 0;
            inset-inline: 0;
            background: #fff;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: center;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -4px 24px #00000012;
            z-index: 100;
            height: var(--nav-h)
        }

        nav a {
            flex: 1;
            max-width: 120px;
            text-align: center;
            padding: 10px 0 6px;
            font-size: 11px;
            color: var(--muted);
            cursor: pointer;
            transition: color .15s;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px
        }

        nav a .ico {
            font-size: 22px;
            transition: transform .2s
        }

        nav a.on {
            color: var(--rose)
        }

        nav a.on .ico {
            transform: scale(1.2)
        }

        /* ── CALENDAR ── */
        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center
        }

        .cal div {
            padding: 8px 2px;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            font-size: 13px;
            transition: background .15s
        }

        .cal div:hover {
            background: var(--soft)
        }

        .cal .h {
            cursor: default;
            font-size: 11px;
            color: var(--muted);
            font-weight: 700;
            padding: 4px 2px
        }

        .cal .s {
            background: linear-gradient(135deg, var(--rose), var(--rose2));
            color: #fff;
            font-weight: 800
        }

        .cal .d::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--gold)
        }

        .cal .w {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
            font-weight: 800
        }

        /* ── DIALOG / MODAL ── */
        dialog {
            border: 0;
            border-radius: 22px;
            width: min(94vw, 440px);
            padding: 0;
            color: var(--ink);
            box-shadow: 0 24px 64px #00000030
        }

        dialog::backdrop {
            background: #00000060;
            backdrop-filter: blur(4px)
        }

        .dlg-inner {
            padding: 20px 20px 16px
        }

        .dlg-title {
            font-size: 17px;
            font-weight: 800;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 12px;
            margin-bottom: 3px
        }

        input,
        select,
        textarea {
            width: 100%;
            font: 500 14px/1.4 Tajawal, system-ui;
            padding: 10px 12px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: #fafafa;
            transition: border .2s;
            outline: none
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--rose);
            background: #fff
        }

        .dlg-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px
        }

        .dlg-actions button {
            flex: 1;
            padding: 12px
        }

        /* ── LOGIN ── */
        #login-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #2d0f20 0%, #5c1f3e 50%, #7c3d5e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px
        }

        .login-box {
            background: #fff;
            border-radius: 28px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 32px 80px #00000060
        }

        .login-logo {
            text-align: center;
            font-size: 52px;
            margin-bottom: 8px
        }

        .login-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 4px
        }

        .login-sub {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px
        }

        .login-box input {
            margin-bottom: 10px;
            font-size: 15px;
            padding: 13px 14px
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 14px;
            margin-top: 6px
        }

        .login-err {
            color: var(--bad);
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            min-height: 20px;
            font-weight: 600
        }

        /* ── OFFLINE BAR ── */
        .off-bar {
            background: linear-gradient(90deg, var(--gold), var(--gold2));
            color: #fff;
            text-align: center;
            font-size: 12px;
            padding: 6px;
            font-weight: 700
        }

        /* ── BUDGET ITEM ── */
        .budget-item {
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 12px;
            margin-bottom: 6px;
            transition: background .15s
        }

        .budget-item:hover {
            background: var(--soft)
        }

        .budget-item .bi-name {
            font-size: 14px;
            font-weight: 600
        }

        .budget-item .bi-nums {
            font-size: 12px;
            color: var(--muted);
            margin-top: 1px
        }

        .budget-item .bi-remain {
            font-size: 14px;
            font-weight: 800;
            color: var(--rose)
        }

        /* ── SECTION HEADER ── */
        .sec-head {
            background: linear-gradient(135deg, var(--soft), #fff);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .sec-head b {
            font-size: 14px;
            font-weight: 800
        }

        .sec-head .sec-nums {
            font-size: 12px;
            color: var(--muted);
            text-align: left
        }

        /* ── DESKTOP ── */
        @media(min-width:860px) {
            nav {
                top: 0;
                bottom: auto;
                inset-inline: auto 0;
                width: 90px;
                height: 100vh;
                flex-direction: column;
                justify-content: flex-start;
                border-top: 0;
                border-inline-start: 1px solid var(--line);
                box-shadow: none
            }

            nav a {
                max-width: none;
                flex: 0;
                padding: 20px 0
            }

            body {
                padding: 0 90px 0 0
            }
        }
    </style>
</head>

                const all = await tx('readonly', s => s.getAll()), dirty = all.filter(r => r.dirty);
                if (dirty.length) { const { error } = await sb.from('records').upsert(dirty.map(({ dirty: _, ...r }) => ({ ...r, wedding_id: wid }))); if (error) throw error; for (const r of dirty) await put({ ...r, dirty: 0 }) }
                const { data, error } = await sb.from('records').select('*').eq('wedding_id', wid); if (error) throw error;
                const loc = Object.fromEntries((await tx('readonly', s => s.getAll())).map(r => [r.id, r]));
                for (const r of data) { const l = loc[r.id]; if (!l || (!l.dirty && r.updated_at > l.updated_at)) await put({ ...r, dirty: 0 }) }
                await load(); render()
            } catch (e) { console.warn('sync', e) }
        }

        // helpers
        const fmt = n => Math.round(n || 0).toLocaleString('ar-EG');
        const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()) };
        const days = s => Math.round((new Date(s + 'T00:00') - today()) / 864e5);
        const when = s => { const d = days(s); return d == 0 ? '<b>النهارده</b>' : d > 0 ? `باقي ${fmt(d)} يوم` : `<span class="late">متأخر ${fmt(-d)} يوم</span>` };
        const dstr = s => new Date(s + 'T00:00').toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
        const cost = i => +(D(i).act || D(i).est) || 0, paid = i => K('pay').filter(p => D(p).item == i.id).reduce((a, p) => a + (+D(p).amt || 0), 0);
        const sum = l => l.reduce((a, i) => ({ e: a.e + (+D(i).est || 0), c: a.c + cost(i), p: a.p + paid(i) }), { e: 0, c: 0, p: 0 });
        const items = s => K('item').filter(i => D(i).sec == s);
        const need = () => sum(K('item').filter(i => D(i).sec != 'month'));
        const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;

        // modal form
        function form(title, fields, ok, extra = '') {
            const d = $('#dlg');
            d.innerHTML = `<div class="dlg-inner"><div class="dlg-title">${title}</div><form method="dialog">
  ${fields.map(x => `<label>${x.l}</label>${x.o
                ? `<select name="${x.k}">${x.o.map(([v, t]) => `<option value="${v}" ${v == x.v ? 'selected' : ''}>${t}</option>`).join('')}</select>`
                : `<input name="${x.k}" type="${x.t || 'text'}" value="${x.v ?? ''}" placeholder="${x.l}">`
                }`).join('')}${extra}
  <div class="dlg-actions"><button class="p" value="ok">💾 حفظ</button><button value="x">إلغاء</button></div>
  </form></div>`;
            d.querySelector('form').onsubmit = e => { if (e.submitter.value == 'ok') ok(Object.fromEntries(new FormData(e.target))) };
            d.showModal();
        }

        const itemOpts = () => [['', '— بدون —'], ...K('item').filter(i => D(i).sec != 'month').map(i => [i.id, D(i).name])];
        const whoOpts = () => [['a', nm('a')], ['b', nm('b')], ['t', 'سوا']];

        // actions
        const addTask = t => form(t ? '✏️ تعديل مهمة' : '✅ مهمة جديدة',
            [{ k: 'title', l: 'المهمة', v: t && D(t).title }, { k: 'date', l: 'التاريخ', t: 'date', v: t && D(t).date },
            { k: 'time', l: 'الوقت (اختياري)', t: 'time', v: t && D(t).time }, { k: 'who', l: 'مين المسؤول', o: whoOpts(), v: t ? D(t).who : me },
            { k: 'status', l: 'الحالة', o: Object.entries(ST), v: t ? D(t).status : 'todo' }, { k: 'notes', l: 'ملاحظات', v: t && D(t).notes }],
            v => { if (!v.title) return; save('task', v, t && t.id); log((t ? 'عدّلت مهمة: ' : 'أضاف/ت مهمة: ') + v.title) });

        const addItem = (i, sec) => form(i ? '✏️ تعديل بند' : '💰 بند جديد',
            [{ k: 'name', l: 'البند', v: i && D(i).name }, { k: 'sec', l: 'القسم', o: Object.entries(SEC), v: i ? D(i).sec : sec || 'bride' },
            { k: 'est', l: 'التكلفة التقديرية (جنيه)', t: 'number', v: i && D(i).est }, { k: 'act', l: 'التكلفة الفعلية (جنيه)', t: 'number', v: i && D(i).act },
            { k: 'notes', l: 'ملاحظات', v: i && D(i).notes }],
            v => { if (!v.name) return; save('item', { ...(i ? D(i) : {}), ...v, sub: i ? D(i).sub : null }, i && i.id); log(`${i ? 'عدّلت' : 'أضاف/ت'} بند: ${v.name}`) });

        const addPay = it => form('💳 دفعة جديدة',
            [{ k: 'item', l: 'البند', o: itemOpts().slice(1), v: it && it.id }, { k: 'amt', l: 'المبلغ (جنيه)', t: 'number' },
            { k: 'date', l: 'التاريخ', t: 'date', v: new Date().toISOString().slice(0, 10) }, { k: 'note', l: 'ملاحظة' }],
            v => { if (!+v.amt) return; save('pay', v); log(`دفع/ت ${fmt(v.amt)} جنيه`) });

        const openItem = id => {
            const i = K('item').find(x => x.id == id), ps = K('pay').filter(p => D(p).item == id);
            const remain = cost(i) - paid(i);
            form(`💰 ${D(i).name}`,
                [{ k: 'est', l: 'التقديري (جنيه)', t: 'number', v: D(i).est }, { k: 'act', l: 'الفعلي (جنيه)', t: 'number', v: D(i).act }, { k: 'notes', l: 'ملاحظات', v: D(i).notes }],
                v => { save('item', { ...D(i), ...v }, id); log('عدّلت ميزانية ' + D(i).name) },
                `<div style="margin-top:14px"><div style="font-weight:800;font-size:13px;margin-bottom:8px">الدفعات</div>
    ${ps.map(p => `<div class="row sm" style="padding:6px 0;border-bottom:1px solid var(--line)">${dstr(D(p).date)} — <b>${fmt(D(p).amt)} جنيه</b>${D(p).note ? ` (${D(p).note})` : ''}<a onclick="rm(K('pay').find(x=>x.id=='${p.id}'))" style="cursor:pointer;color:var(--bad)">🗑</a></div>`).join('') || '<div class="sm" style="padding:8px 0">لسه مفيش دفعات</div>'}
    <div class="row" style="margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line)">
      <span><b style="color:${remain < 0 ? 'var(--ok)' : 'var(--rose)'}">${remain <= 0 ? '✅ مدفوع بالكامل' : 'متبقي ' + fmt(remain) + ' جنيه'}</b></span>
      <a class="btn" onclick="$('#dlg').close();addPay(K('item').find(x=>x.id=='${id}'))">+ دفعة</a>
    </div>`)
        };

        Object.assign(window, { rm, K, D, addPay, $, dlg: $('#dlg') });

        // views
        const statusBadge = s => ({ todo: '<span class="task-status status-todo">لسه</span>', doing: '<span class="task-status status-doing">شغالين</span>', done: '<span class="task-status status-done">✓ تمت</span>' })[s] || '';

        const taskRow = t => {
            const d = D(t); return `<div class="task-row ${d.status == 'done' ? 'done-row' : ''}" onclick="addTask(K('task').find(x=>x.id=='${t.id}'))">
  <div style="flex:1;min-width:0"><b>${d.title}</b><div class="sm" style="margin-top:3px">${d.date ? dstr(d.date) : ''}${d.time ? ' • ' + d.time : ''} • <span class="tag">${nm(d.who)}</span></div></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${statusBadge(d.status)}<span class="sm">${d.status != 'done' && d.date ? when(d.date) : ''}</span></div>
</div>`};

        const V_ = {
            home() {
                const T = K('task').filter(t => D(t).status != 'done').sort((a, b) => D(a).date > D(b).date ? 1 : -1);
                const n = need(), ts = K('task'), dn = ts.filter(t => D(t).status == 'done').length, late = T.filter(t => D(t).date && days(D(t).date) < 0);
                const g = cfg().data, have = (+g.have || 0) + (+g.save || 0) + (+g.bonus || 0);
                return `<div class="card hero-card">
      <div class="sm" style="color:#ffffff99;margin-bottom:4px">💍 ${dstr(WEDDING)}</div>
      <span class="days-big">${fmt(Math.max(0, days(WEDDING)))}</span>
      <div class="days-label">يوم على الفرح</div>
    </div>
    <div class="qa">
      <button class="p" onclick="addTask()">+ مهمة</button>
      <button onclick="addItem()">+ بند</button>
      <button class="g" onclick="addPay()">+ دفعة</button>
      <button onclick="nav('cal')">📅 الجدول</button>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">إجمالي الميزانية</div><div class="stat-val rose">${fmt(n.c)}</div></div>
      <div class="stat-card"><div class="stat-label">المدفوع</div><div class="stat-val ok">${fmt(n.p)}</div></div>
      <div class="stat-card"><div class="stat-label">المتبقي للدفع</div><div class="stat-val gold">${fmt(n.c - n.p)}</div></div>
      <div class="stat-card"><div class="stat-label">الفرق عن المتاح</div><div class="stat-val ${have - n.c < 0 ? 'bad' : 'ok'}">${fmt(have - n.c)}</div></div>
    </div>
    <div class="card">
      <div class="prog-wrap"><div class="prog-label"><span>المهام المكتملة</span><span>${dn}/${ts.length}</span></div><div class="bar ok-bar"><i style="width:${pct(dn, ts.length)}%"></i></div></div>
      <div class="prog-wrap"><div class="prog-label"><span>المدفوع من الميزانية</span><span>${pct(n.p, n.c)}%</span></div><div class="bar"><i style="width:${pct(n.p, n.c)}%"></i></div></div>
    </div>
    <h2>📋 المهام الجاية ${late.length ? `<span class="late sm">(${fmt(late.length)} متأخرة)</span>` : ''}</h2>
    ${T.slice(0, 5).map(taskRow).join('') || '<div class="card sm" style="text-align:center;padding:20px">مفيش مهام — ضيفوا أول مهمة 🎉</div>'}
    <h2>📜 آخر التحديثات</h2>
    <div class="card">${K('act').sort((a, b) => D(b).at > D(a).at ? 1 : -1).slice(0, 6).map(a => `<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line)">• ${D(a).t}</div>`).join('') || '<div class="sm">لا يوجد تحديثات</div>'}</div>`;
            },
            cal() {
                const b = new Date(today().getFullYear(), today().getMonth() + CM, 1), y = b.getFullYear(), m = b.getMonth();
                const dim = new Date(y, m + 1, 0).getDate(), off = (b.getDay() + 1) % 7, p2 = n => String(n).padStart(2, '0');
                const ev = {};
                K('task').forEach(t => D(t).date && (ev[D(t).date] ??= []).push(`✅ ${D(t).title}`));
                K('pay').forEach(p => D(p).date && (ev[D(p).date] ??= []).push(`💰 ${fmt(D(p).amt)} جنيه`));
                (ev[WEDDING] ??= []).push('💍 يوم الفرح');
                let c = ['س', 'ح', 'ن', 'ث', 'ر', 'خ', 'ج'].map(x => `<div class="h">${x}</div>`).join('') + '<div></div>'.repeat(off);
                for (let d = 1; d <= dim; d++) { const s = `${y}-${p2(m + 1)}-${p2(d)}`; c += `<div class="${ev[s] ? 'd ' : ''}${s == CD ? 's ' : ''}${s == WEDDING ? 'w' : ''}" onclick="CD='${s}';render()">${d}</div>` }
                return `<div class="card" style="margin-bottom:0">
      <div class="row" style="margin-bottom:12px"><button onclick="cm(-1)" style="padding:8px 14px">›</button><b>${b.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' })}</b><button onclick="cm(1)" style="padding:8px 14px">‹</button></div>
      <div class="cal">${c}</div>
    </div>
    ${CD ? `<h2>📅 ${dstr(CD)} — ${when(CD)}</h2>${(ev[CD] || ['مفيش حاجة في اليوم ده']).map(e => `<div class="card">${e}</div>`).join('')}<button class="p" onclick="addTask()">+ مهمة في هذا اليوم</button>` : ''}`;
            },
            budget() {
                const g = cfg().data, have = (+g.have || 0) + (+g.save || 0) + (+g.bonus || 0), n = need();
                let h = `<div class="stats">
      <div class="stat-card"><div class="stat-label">اللي معانا</div><div class="stat-val ok">${fmt(have)}</div></div>
      <div class="stat-card"><div class="stat-label">اللي محتاجينه</div><div class="stat-val rose">${fmt(n.c)}</div></div>
    </div>
    <div class="card row"><b>الفرق</b><span style="font-size:20px;font-weight:900;color:${have - n.c < 0 ? 'var(--bad)' : 'var(--ok)'}">${fmt(have - n.c)} جنيه</span></div>
    <div class="qa" style="margin-bottom:12px"><button onclick="editHave()">✏️ تعديل المتاح</button><button class="p" onclick="addItem()">+ بند جديد</button></div>`;
                for (const [s, t] of Object.entries(SEC)) {
                    const l = items(s), x = sum(l);
                    if (!l.length && s != 'month') continue;
                    h += `<div class="sec-head"><b>${t}</b><div class="sec-nums">${s == 'month' ? '(مش داخلة في الإجمالي)' : `مدفوع ${fmt(x.p)} من ${fmt(x.c)}`}</div></div>
      <div class="card" style="padding:8px 12px">
      ${s != 'month' && x.c ? `<div class="prog-wrap"><div class="prog-label"><span>نسبة المدفوع</span><span>${pct(x.p, x.c)}%</span></div><div class="bar"><i style="width:${pct(x.p, x.c)}%"></i></div></div>` : ''} 
      ${l.map(i => s == 'month'
                        ? `<div class="budget-item row" onclick="addItem(K('item').find(x=>x.id=='${i.id}'))"><span class="bi-name">${D(i).name}</span><span class="bi-nums">تقديري ${fmt(D(i).est)} • فعلي ${fmt(D(i).act)} جنيه</span></div>`
                        : `<div class="budget-item" onclick="openItem('${i.id}')"><div class="row"><span class="bi-name">${D(i).sub ? `<span class="tag">${D(i).sub}</span> ` : ''}${D(i).name}</span><span class="bi-remain">${cost(i) - paid(i) > 0 ? `${fmt(cost(i) - paid(i))} جنيه` : '✅ مكتمل'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${pct(paid(i), cost(i))}%"></i></div></div>`
                    ).join('') || '<div class="sm" style="padding:8px 0;text-align:center">لا يوجد بنود — اضغط + بند جديد</div>'}
      </div>`;
                }
                return h;
            },
            tasks() {
                return `<div class="qa" style="margin-bottom:8px"><button class="p" onclick="addTask()">+ مهمة جديدة</button></div>` +
                    ['todo', 'doing', 'done'].map(s => `<h2>${{ todo: '⏳', doing: '🔄', done: '✅' }[s]} ${ST[s]}</h2>` +
                        (K('task').filter(t => D(t).status == s).sort((a, b) => D(a).date > D(b).date ? 1 : -1).map(taskRow).join('') || `<div class="card sm" style="text-align:center;padding:16px">لا يوجد مهام هنا</div>`)).join('');
            },
            set() {
                return `<div class="card"><b>👤 الحساب والأسماء</b><br><br>
      <button onclick="editNames()">✏️ تعديل الأسماء</button>
      <label>أنا<select onchange="localStorage.me=me=this.value;render()">${whoOpts().slice(0, 2).map(([v, t]) => `<option value="${v}" ${v == me ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
    <div class="card"><b>🔗 كود الدعوة</b><div style="font-size:28px;font-weight:900;letter-spacing:4px;margin:8px 0;color:var(--rose)">${code || (sb ? '—' : 'وضع محلي')}</div><div class="sm">ابعت الكود لشريكك علشان يدخل التطبيق</div></div>
    <div class="card row"><button onclick="sync()">🔄 مزامنة الآن</button>${sb ? `<button class="x" onclick="sb.auth.signOut().then(()=>{localStorage.clear();location.reload()})">🚪 خروج</button>` : ''}</div>`;
            }
        };

        const editNames = () => form('👤 الأسماء', [{ k: 'a', l: 'اسم الطرف الأول', v: cfg().data.a }, { k: 'b', l: 'اسم الطرف التاني', v: cfg().data.b }], v => save('cfg', { ...cfg().data, ...v }, cfg().id));
        const editHave = () => { const g = cfg().data; form('💰 اللي معانا', [{ k: 'have', l: 'المبلغ المتاح حاليًا (جنيه)', t: 'number', v: g.have }, { k: 'save', l: 'مدخرات متوقعة قبل الفرح (جنيه)', t: 'number', v: g.save }, { k: 'bonus', l: 'بونص أو مبلغ إضافي (جنيه)', t: 'number', v: g.bonus }], v => save('cfg', { ...g, ...v }, cfg().id)) };

        Object.assign(window, { addTask, addItem, openItem, editNames, editHave, sync, render: () => render(), nav: v => { V = v; render() }, CD: null });

        function render() {
            $('#app').innerHTML = V_[V]();
            $('#nav').innerHTML = [['home', '🏠', 'الرئيسية'], ['cal', '📅', 'الجدول'], ['budget', '💰', 'الميزانية'], ['tasks', '✅', 'المهام'], ['set', '⚙️', 'الإعدادات']]
                .map(([k, i, t]) => `<a class="${V == k ? 'on' : ''}" onclick="nav('${k}')"><span class="ico">${i}</span>${t}</a>`).join('');
        }

        Object.defineProperty(window, 'CD', { get: () => CD, set: v => CD = v });
        window.cm = d => { CM += d; render() }; window.sb = sb;

        const offl = () => $('#off-bar').hidden = navigator.onLine;
        addEventListener('online', () => { offl(); sync() }); addEventListener('offline', offl); offl();

        // LOGIN
        window.doLogin = async () => {
            const e = $('#li-email').value.trim(), p = $('#li-pass').value;
            if (!e || !p) { $('#li-err').textContent = 'من فضلك ادخل الإيميل وكلمة السر'; return }
            $('#li-err').textContent = 'جاري الدخول...';
            const { error } = await sb.auth.signInWithPassword({ email: e, password: p });
            if (error) { $('#li-err').textContent = '❌ الإيميل أو كلمة السر غلط'; return }
            $('#login-screen').style.display = 'none';
            boot();
        };
        // allow enter key
        document.addEventListener('keydown', e => { if (e.key == 'Enter' && !$('#login-screen').hidden) doLogin() });

        async function setupWedding() {
            let n = await new Promise(r => form('أهلاً 💍', [{ k: 'n', l: 'اسمك' }, { k: 'c', l: 'كود الدعوة (اتركه فاضي لإنشاء مشروع جديد)' }], r));
            const { data, error } = n.c ? await sb.rpc('join_wedding', { c: n.c.trim(), n: n.n }) : await sb.rpc('create_wedding', { n: n.n });
            if (error) return alert('الكود غلط أو مكتمل');
            wid = localStorage.wid = data.id; code = localStorage.code = data.code;
            if (!n.c) {
                for (const [sec, sub, l] of SEED) for (const name of l) await put({ id: uid(), kind: 'item', data: { sec, sub, name, est: 0, act: 0 }, updated_at: new Date().toISOString(), deleted: false, dirty: 1 });
                await put({ id: uid(), kind: 'cfg', data: { a: n.n, b: '', have: 0, save: 0, bonus: 0 }, updated_at: new Date().toISOString(), deleted: false, dirty: 1 }); localStorage.me = 'a';
            } else localStorage.me = me = 'b';
            await sync();
        }

        async function boot() {
            await load();
            if (sb) {
                const { data: { session } } = await sb.auth.getSession();
                if (!session) { hideSplash(); $('#login-screen').style.display = 'flex'; return }
                if (session && !wid) { const { data: m } = await sb.from('members').select('wedding_id,weddings(code)').limit(1); if (m?.[0]) { wid = localStorage.wid = m[0].wedding_id; code = localStorage.code = m[0].weddings.code } else await setupWedding(); await load() }
                sb.channel('r').on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, sync).subscribe(); sync();
            } else if (!K('item').length) {
                for (const [sec, sub, l] of SEED) for (const name of l) await put({ id: uid(), kind: 'item', data: { sec, sub, name, est: 0, act: 0 }, updated_at: new Date().toISOString(), deleted: false, dirty: 0 });
                await put({ id: uid(), kind: 'cfg', data: { a: 'العروسة', b: 'العريس', have: 0, save: 0, bonus: 0 }, updated_at: '', deleted: false, dirty: 0 }); await load();
            }
            render();
        }

        const hideSplash = () => { const s = $('#splash'); if (!s) return; s.style.opacity = '0'; setTimeout(() => s.remove(), 450); };
        boot().then(hideSplash);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>

</html>
