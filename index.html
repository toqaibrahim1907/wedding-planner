<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>الفرح</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg">
    <meta name="theme-color" content="#a85a72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #faf6f4;
            --ink: #2b2226;
            --mut: #8b7b82;
            --card: #fff;
            --line: #f0e4e7;
            --rose: #b0526f;
            --on: #fff;
            --gold: #c29a5b;
            --soft: #f6ecef;
            --ok: #3f8f66;
            --bad: #c2453b;
            --sh: 0 1px 2px #0000000a, 0 12px 28px -14px #78334f40
        }

        [data-theme=dark] {
            --bg: #16111a;
            --ink: #f3eaee;
            --mut: #a899a1;
            --card: #211a26;
            --line: #33283b;
            --rose: #e58fab;
            --on: #1b1218;
            --gold: #d7b27a;
            --soft: #2b2131;
            --ok: #6fc596;
            --bad: #ff8a7e;
            --sh: 0 1px 2px #0006, 0 12px 28px -14px #000a;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        [hidden] {
            display: none !important
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 500 15px/1.6 'Plus Jakarta Sans', Tajawal, system-ui, sans-serif;
            padding-bottom: 104px;
            transition: background .2s, color .2s
        }

        main {
            max-width: 760px;
            margin: auto;
            padding: 8px 16px
        }

        h2 {
            font-size: 16px;
            font-weight: 800;
            margin: 24px 0 10px
        }

        .top {
            max-width: 760px;
            margin: auto;
            padding: 14px 16px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .top>b {
            font-size: 20px;
            font-weight: 800
        }

        .top span {
            display: flex;
            gap: 6px
        }

        .top button {
            border: 0;
            background: var(--card);
            box-shadow: var(--sh);
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 18px;
            border-radius: 50%;
            position: relative
        }

        .bd {
            position: absolute;
            top: -3px;
            inset-inline-end: -3px;
            background: var(--bad);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            border-radius: 9px;
            padding: 0 6px;
            line-height: 18px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--sh)
        }

        .hero {
            background: linear-gradient(135deg, #b0526f, #6b3358);
            color: #fff;
            border: 0;
            text-align: center;
            padding: 28px 14px
        }

        .hero b {
            font-size: 60px;
            font-weight: 800;
            display: block;
            line-height: 1.05;
            margin: 6px 0
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .sm {
            font-size: 13px;
            color: var(--mut)
        }

        .bar {
            height: 8px;
            background: var(--soft);
            border-radius: 9px;
            overflow: hidden;
            margin: 8px 0
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--rose));
            border-radius: 9px;
            transition: width .4s
        }

        .g2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin-bottom: 12px
        }

        .g2 .card {
            margin: 0
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px
        }

        .grid .card {
            margin: 0
        }

        .n {
            font-weight: 800;
            font-size: 22px
        }

        button,
        .btn {
            font: inherit;
            font-weight: 700;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--rose);
            border-radius: 999px;
            padding: 7px 16px;
            cursor: pointer
        }

        button.p {
            background: var(--rose);
            color: var(--on);
            border-color: var(--rose)
        }

        button.x {
            color: var(--bad)
        }

        .qa {
            display: flex;
            gap: 8px;
            overflow: auto;
            margin: 14px 0
        }

        .qa button {
            white-space: nowrap
        }

        nav {
            position: fixed;
            bottom: 12px;
            inset-inline: 12px;
            max-width: 520px;
            margin: auto;
            background: color-mix(in srgb, var(--card) 88%, transparent);
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            box-shadow: var(--sh);
            border-radius: 26px;
            display: flex;
            padding: 4px 6px calc(4px + env(safe-area-inset-bottom))
        }

        nav a {
            flex: 1;
            text-align: center;
            padding: 7px 0;
            font-size: 11px;
            color: var(--mut);
            cursor: pointer;
            border-radius: 20px
        }

        nav a.on {
            color: var(--rose);
            font-weight: 800;
            background: var(--soft)
        }

        nav a span {
            display: block;
            font-size: 19px
        }

        .late {
            color: var(--bad)
        }

        .ok {
            color: var(--ok)
        }

        .tag {
            font-size: 12px;
            background: var(--soft);
            color: var(--rose);
            border-radius: 999px;
            padding: 1px 10px
        }

        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center
        }

        .cal div {
            padding: 9px 0;
            border-radius: 14px;
            cursor: pointer;
            position: relative
        }

        .cal .h {
            cursor: default;
            font-size: 12px;
            color: var(--mut)
        }

        .cal .s {
            background: var(--rose);
            color: var(--on)
        }

        .cal .d::after {
            content: "";
            position: absolute;
            bottom: 3px;
            left: calc(50% - 2px);
            width: 5px;
            height: 5px;
            border-radius: 9px;
            background: var(--gold)
        }

        .cal .w {
            outline: 2px solid var(--gold)
        }

        .board {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 8px
        }

        .col {
            flex: 0 0 82%;
            max-width: 320px;
            scroll-snap-align: start;
            background: var(--soft);
            border-radius: 22px;
            padding: 10px;
            min-height: 260px
        }

        .col h3 {
            margin: 6px 8px 10px;
            font-size: 15px
        }

        .col .card {
            margin-bottom: 10px;
            cursor: grab;
            box-shadow: none
        }

        details>summary {
            cursor: pointer;
            list-style: none
        }

        details.card details {
            border-top: 1px dashed var(--line);
            padding: 10px 0
        }

        .tot {
            background: var(--soft);
            border-radius: 14px;
            padding: 10px;
            margin: 10px 0
        }

        .tk {
            padding: 4px 0;
            cursor: pointer
        }

        dialog {
            border: 0;
            border-radius: 24px;
            width: min(92vw, 440px);
            max-height: 88vh;
            padding: 20px;
            background: var(--card);
            color: var(--ink);
            box-shadow: var(--sh)
        }

        dialog::backdrop {
            background: #0008;
            backdrop-filter: blur(2px)
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin-top: 10px
        }

        input,
        select,
        textarea {
            width: 100%;
            font: inherit;
            color: var(--ink);
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--bg)
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--rose);
            outline-offset: -1px
        }

        .nt {
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--line);
            margin-bottom: 8px;
            cursor: pointer
        }

        .nt.u {
            background: var(--soft)
        }

        .off {
            background: var(--gold);
            color: #fff;
            text-align: center;
            font-size: 12px;
            padding: 3px
        }

        @media(min-width:900px) {
            nav {
                top: 12px;
                bottom: 12px;
                inset-inline: auto 12px;
                width: 92px;
                max-width: none;
                margin: 0;
                flex-direction: column;
                justify-content: flex-start;
                gap: 4px;
                padding: 10px 6px
            }

            nav a {
                padding: 12px 0;
                flex: 0
            }

            body {
                padding: 0;
                padding-inline-end: 116px
            }

            .col {
                flex: 1 1 0;
                max-width: none
            }
        }

        .ic {
            vertical-align: -4px;
            flex: none
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--rose)
        }

        .top button {
            color: var(--ink);
            display: grid;
            place-items: center
        }

        .ci {
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--soft);
            font-size: 18px
        }

        .chip {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: var(--soft);
            color: var(--rose);
            margin-inline-end: 4px
        }

        .chip.ok {
            color: var(--ok)
        }

        .chip.late {
            color: var(--bad)
        }

        .hero {
            background: radial-gradient(circle at 12% 18%, #ffffff2e, transparent 42%), radial-gradient(circle at 90% 90%, #e5a35a40, transparent 45%), linear-gradient(135deg, #b0526f, #5e2c55);
            font-variant-numeric: tabular-nums
        }

        .hero>.ic {
            opacity: .9
        }

        .hero b {
            letter-spacing: -1px
        }

        .k {
            border-inline-start: 4px solid var(--line)
        }

        .s-doing {
            border-inline-start-color: var(--gold)
        }

        .s-done {
            border-inline-start-color: var(--ok)
        }

        .s-todo {
            border-inline-start-color: var(--mut)
        }

        button {
            transition: transform .12s, box-shadow .2s
        }

        button:active {
            transform: scale(.96)
        }

        button.p {
            box-shadow: 0 8px 18px -8px var(--rose)
        }

        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: background .2s, color .2s
        }

        nav a span {
            display: grid;
            place-items: center
        }

        .card {
            transition: box-shadow .2s, transform .2s
        }

        .grid .card .n,
        .g2 .card .n {
            margin-top: 2px
        }

        .tag {
            font-weight: 700
        }

        .bar {
            height: 7px
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

                for (const c of cats()) {
                    const its = itemsOf(c), x = sum(its);
                    h += `<details class="card" ${OP[c.id] ? 'open' : ''} ontoggle="OP['${c.id}']=this.open"><summary class="row"><b class="row" style="justify-content:flex-start"><span class="ci">${D(c).icon || '📁'}</span> ${D(c).name}</b><span class="sm">${D(c).ex ? tt('exNote') : fmt(x.r)}</span></summary>
${its.map(i => {
                        const tk = K('task').filter(t => D(t).item == i.id).sort((a, b) => D(a).date > D(b).date ? 1 : -1); return `<details ${OP[i.id] ? 'open' : ''} ontoggle="OP['${i.id}']=this.open"><summary class="row"><span>${D(i).sub ? `<span class="tag">${D(i).sub}</span> ` : ''}${D(i).name}</span><b>${fmt(tot(i).r)}</b></summary>
${tk.map(t => `<div class="tk row" onclick="addTask('${t.id}')"><span>${D(t).status == 'done' ? '✓' : '○'} ${D(t).title}</span><span class="sm">${D(t).fin == '1' ? fmt(D(t).status == 'todo' ? D(t).est : (+D(t).act || +D(t).est)) : ''}</span></div>`).join('')}
${totRow(tot(i), tt('itemTotal'))}<div class="row"><button onclick="addTask(null,null,'${i.id}')">${ic('plus', 15)} ${tt('addTask')}</button><button onclick="addItem('${i.id}')">${ic('edit', 14)}</button></div></details>`
                    }).join('')}
${totRow(x, tt('catTotal'))}<div class="row"><button onclick="addItem(null,'${c.id}')">${ic('plus', 15)} ${tt('addItem')}</button><button onclick="editCat('${c.id}')">${ic('edit', 14)}</button></div></details>`
                } return h
            },
            tasks() { return `<button class="p" onclick="addTask()">${ic('plus', 15)} ${tt('addTask')}</button><h2>${tt('board')}</h2><div class="board">${ORD.map(s => `<div class="col" ondragover="event.preventDefault()" ondrop="event.preventDefault();setStatus(event.dataTransfer.getData('text'),'${s}')"><h3>${tt(s)} (${fmt(K('task').filter(t => D(t).status == s).length)})</h3>${K('task').filter(t => D(t).status == s).sort((a, b) => D(a).date > D(b).date ? 1 : -1).map(t => tc(t, 1)).join('')}</div>`).join('')}</div>` },
            set() {
                return `<div class="card"><b>${tt('wdate')}</b><br><button onclick="askDate()">${cfg().data.date ? dstr(cfg().data.date) : '—'}</button></div><div class="card"><button onclick="editNames()">${tt('names')}</button><label>${tt('me')}<select onchange="setMe(this.value)">${whoOpts().slice(0, 2).map(([v, t]) => `<option value="${v}" ${v == me ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
<div class="card"><button onclick="langMenu()">${ic('globe', 16)} ${tt('lang')}</button></div><div class="card"><b>${tt('invite')}</b><div class="n">${code || '—'}</div></div><div class="card"><button onclick="sync()">${ic('sync', 16)} ${tt('syncNow')}</button> ${sb ? `<button class="x" onclick="sb.auth.signOut().then(()=>{localStorage.clear();location.reload()})">${tt('logout')}</button>` : ''}</div>`
            }
        };
        const cover = (a, n) => n <= 0 ? tt('allSet') : a >= n ? tt('covered', a - n) : tt('part', pct(a, n), 100 - pct(a, n));
        let CM = 0, CD = new Date().toISOString().slice(0, 10);
        function render() {
            document.documentElement.dataset.theme = thm(); $('meta[name=theme-color]').content = thm() == 'dark' ? '#16111a' : '#b0526f'; document.documentElement.lang = L; document.documentElement.dir = L == 'ar' ? 'rtl' : 'ltr';
            const u = notes().filter(n => !n.own && !RD().has(n.k)).length;
            $('#top').innerHTML = `<b class="logo">${ic('gem', 22)} ${L == 'ar' ? 'الفرح' : 'Wedding'}</b><span><button onclick="toggleTheme()">${ic(thm() == 'dark' ? 'sun' : 'moon', 19)}</button><button onclick="langMenu()">${ic('globe', 19)}</button><button onclick="openNotes()">${ic('bell', 19)}${u ? `<span class="bd">${fmt(u)}</span>` : ''}</button></span>`;
            $('#app').innerHTML = V_[V](); $('#nav').innerHTML = [['home', 'home'], ['cal', 'cal'], ['budget', 'wallet'], ['tasks', 'check'], ['set', 'gear']].map(([k, i]) => `<a class="${V == k ? 'on' : ''}" onclick="nav('${k}')"><span>${ic(i, 22)}</span>${tt(k)}</a>`).join('');
            $('#off').textContent = tt('offline'); if (cfg().id && !cfg().data.date && !$('#dlg').open && !skipD) askDate()
        }
        const offl = () => $('#off').hidden = navigator.onLine; addEventListener('online', () => { offl(); sync() }); addEventListener('offline', offl); offl();
        const db = await new Promise(r => { const q = indexedDB.open('farah', 1); q.onupgradeneeded = () => q.result.createObjectStore('r', { keyPath: 'id' }); q.onsuccess = () => r(q.result) });
        const tx = (m, f) => new Promise(r => { const t = db.transaction('r', m), q = f(t.objectStore('r')); t.oncomplete = () => r(q.result) });
        let R = [], V = 'home', wid = localStorage.wid || null, code = localStorage.code || '', me = localStorage.me || 'a';
        const load = async () => { R = (await tx('readonly', s => s.getAll())).filter(r => !r.deleted) }, K = k => R.filter(r => r.kind == k), D = r => r.data;
        const put = o => tx('readwrite', s => s.put(o));
        const save = async (kind, data, id) => { await put({ id: id || uid(), kind, data, updated_at: new Date().toISOString(), deleted: false, dirty: 1 }); await load(); render(); sync() };
        const rm = async r => { await put({ ...r, deleted: true, updated_at: new Date().toISOString(), dirty: 1 }); await load(); render(); sync() };
        async function sync() {
            if (!sb || !wid || !navigator.onLine) return; try {
                const all = await tx('readonly', s => s.getAll()), dirty = all.filter(r => r.dirty);
                if (dirty.length) { const { error } = await sb.from('records').upsert(dirty.map(({ dirty: _, ...r }) => ({ ...r, wedding_id: wid }))); if (error) throw error; for (const r of dirty) await put({ ...r, dirty: 0 }) }
                const { data, error } = await sb.from('records').select('*').eq('wedding_id', wid); if (error) throw error;
                const loc = Object.fromEntries((await tx('readonly', s => s.getAll())).map(r => [r.id, r]));
                for (const r of data) { const l = loc[r.id]; if (!l || (!l.dirty && r.updated_at > l.updated_at) || (l.dirty && r.updated_at > l.updated_at)) await put({ ...r, dirty: 0 }) }
                await load(); await migrate(); render()
            } catch (e) { console.warn('sync', e) }
        }

        Object.assign(window, {
            rm, K, D, dlg: $('#dlg'), sb, sync, render, addTask, addItem, editCat, delItem, delCat, mv, setStatus, askDate, editHave, editNames, setLang, langMenu, openNotes, readAll, openNote,
            OP, setMe: v => { localStorage.me = me = v; render() }, nav: v => { V = v; render() }, cm: d => { CM += d; render() }, selDay: s => { CD = s; render() }
        });
        // ---- start / auth
        function login() {
            return new Promise(res => {
                const draw = () => {
                    dlg.innerHTML = `<h2>${ic('gem', 28)}</h2><label>Email<input id="em" type="email" autocomplete="email"></label><label>${tt('pw')}<input id="pw" type="password" autocomplete="current-password"></label><div id="er" class="late sm"></div><div class="row" style="margin-top:12px"><button class="p" id="si">${tt('signin')}</button><button id="su">${tt('signup')}</button><button id="lg">${ic('globe', 16)}</button></div>`;
                    const go = async up => { const c = { email: $('#em').value.trim(), password: $('#pw').value }, r = up ? await sb.auth.signUp(c) : await sb.auth.signInWithPassword(c); if (r.error) $('#er').textContent = r.error.message; else { dlg.close(); res() } };
                    $('#si').onclick = () => go(0); $('#su').onclick = () => go(1); $('#lg').onclick = () => { L = localStorage.lang = L == 'ar' ? 'en' : 'ar'; document.documentElement.dir = L == 'ar' ? 'rtl' : 'ltr'; draw() }
                };
                dlg.oncancel = e => e.preventDefault(); draw(); dlg.showModal()
            })
        }
        const seedAll = async (a, b, dirty) => {
            const now = new Date().toISOString(); for (const [sec, sub, l] of SEED) for (const name of l) await put({ id: uid(), kind: 'item', data: { sec, sub, name, est: 0, act: 0 }, updated_at: now, deleted: false, dirty });
            await put({ id: uid(), kind: 'cfg', data: { a, b, have: 0, save: 0, bonus: 0 }, updated_at: now, deleted: false, dirty })
        };
        async function setupWedding() {
            const n = await new Promise(r => form(ic('gem', 26), [{ k: 'n', l: tt('name') }, { k: 'c', l: tt('inv') }], r));
            const { data, error } = n.c ? await sb.rpc('join_wedding', { c: n.c.trim(), n: n.n }) : await sb.rpc('create_wedding', { n: n.n });
            if (error) { alert(tt('badCode')); return setupWedding() } wid = localStorage.wid = data.id; code = localStorage.code = data.code;
            if (!n.c) { await seedAll(n.n, tt('fiance'), 1); localStorage.me = me = 'a' } else localStorage.me = me = 'b'; await sync()
        }
        async function boot() {
            await load(); await migrate();
            if (sb) {
                let { data: { session } } = await sb.auth.getSession(); if (!session && !wid) { await login(); session = (await sb.auth.getSession()).data.session }
                if (session && !wid) { const { data: m } = await sb.from('members').select('wedding_id,weddings(code)').limit(1); if (m?.[0]) { wid = localStorage.wid = m[0].wedding_id; code = localStorage.code = m[0].weddings.code; localStorage.me = me = m[0].wedding_id ? me : 'a' } else await setupWedding(); await load(); await migrate() }
                sb.channel('r').on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, sync).subscribe(); sync()
            }
            else if (!K('item').length && !K('cfg').length) { await seedAll('العروسة', 'العريس', 0); await load(); await migrate() }
            render()
        }
        boot(); if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>

</html>
